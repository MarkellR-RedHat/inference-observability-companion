# Jaeger all-in-one: OTLP collector, in-memory storage and the UI in one pod.
# For demos. Traces live in the pod's memory and are gone when it restarts.
#
#   oc apply -n <project> -f 01-jaeger-all-in-one.yaml
#
# Workloads in the same project export to   http://jaeger:4317   (gRPC) or   http://jaeger:4318   (HTTP).
# From another project use   http://jaeger.<project>.svc.cluster.local:4317
# The UI is on the Route:   oc get route jaeger-ui -o jsonpath='{.spec.host}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: quay.io/jaegertracing/all-in-one:1.57
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    appProtocol: grpc      # keeps a service mesh from treating the gRPC stream as plain HTTP
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jaeger-ui
  labels:
    app: jaeger
spec:
  to:
    kind: Service
    name: jaeger
  port:
    targetPort: ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
