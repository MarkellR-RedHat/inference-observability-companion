# Add tracing to a model you already serve. This is a fragment, not a complete resource: merge the two fields
# into the InferenceService's spec.predictor.model. KServe appends args to the ServingRuntime's own and merges env.
#
# The flag is what turns tracing on. OTEL_* environment variables alone never do. OTEL_SERVICE_NAME only names
# the service in the trace viewer.
#
# The OpenShift AI dashboard writes to the same two places: Edit deployment > "Additional serving runtime
# arguments" and "Additional environment variables".
#
# Or patch in place. The "-" at the end of each path appends, so existing args and env are kept:
#
#   oc patch inferenceservice <name> -n <project> --type=json -p '[
#     {"op":"add","path":"/spec/predictor/model/args/-","value":"--otlp-traces-endpoint=http://jaeger:4317"},
#     {"op":"add","path":"/spec/predictor/model/env/-","value":{"name":"OTEL_SERVICE_NAME","value":"vllm-server"}}]'
#
#   If the InferenceService has no args or env yet, "add" to "/spec/predictor/model/args" with the whole list instead.
#
# Use http://jaeger.<project>.svc.cluster.local:4317 when Jaeger runs in a different project.
spec:
  predictor:
    model:
      args:
        - --otlp-traces-endpoint=http://jaeger:4317
      env:
        - name: OTEL_SERVICE_NAME
          value: vllm-server
# The pod restarts. Then:
#   oc logs <pod> -c kserve-container | grep -i -E 'otlp|tracing'
#   oc exec <pod> -c kserve-container -- python -c 'import opentelemetry.exporter.otlp.proto.grpc.trace_exporter; print("otel ok")'
